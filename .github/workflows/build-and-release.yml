name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Portable Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore EcoPowerMonitor.csproj

      - name: Publish Single-File Portable Executable
        run: >
          dotnet publish EcoPowerMonitor.csproj
          -r win-x64
          -c Release
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:UseSharedCompilation=false
          -o ./publish

      - name: Copy App Icon
        run: copy app.ico ./publish/app.ico

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/EcoPower.exe, ./publish/app.ico, LICENSE, README.md -DestinationPath ./publish/EcoPower-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./publish/EcoPower.exe
            ./publish/EcoPower-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
